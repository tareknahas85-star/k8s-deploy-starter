apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - ../../base
  - namespace.yaml

namePrefix: dev-

commonLabels:
  environment: dev

# Testing runs one copy and uses less memory.
patches:
  - path: replicas-and-resources.yaml
    target:
      kind: Deployment
      name: demo-web
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: demo-web

configMapGenerator:
  - name: demo-web-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=debug
