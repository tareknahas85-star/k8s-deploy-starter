apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The app described once. The overlays change only what is different
# between testing and production.

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - configmap.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/name: demo-web
  app.kubernetes.io/managed-by: kustomize
